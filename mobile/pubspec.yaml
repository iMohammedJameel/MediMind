name: medimind
description: MediMind — smart medication care (patient & caregiver mobile app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Cubit/BLoC)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Biometric unlock (fingerprint / face)
  local_auth: ^2.3.0

  # Adherence report sharing
  share_plus: ^10.1.2

  # Local notifications & dose reminders
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Looping alarm audio on alarm stream (plays even in silent mode)
  just_audio: ^0.9.42
  audio_session: ^0.1.25

  # UI
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  intl: 0.20.3

  # Camera & OCR scanning
  image_picker: ^1.1.2
  flutter_timezone: ^5.1.0
  connectivity_plus: ^7.3.1
  pdf: ^3.13.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

# App icon generated from the approved MediMind logo.
flutter_launcher_icons:
  android: true
  ios: false # iOS folder not present in this project
  image_path: "assets/medimind_appicon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

# Native splash shown while the Flutter engine boots.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B0F14"
  image: "assets/app_icon_foreground.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0B0F14"
    icon_background_color: "#FFFFFF"
    image: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/medimind_appicon.png
    - assets/app_icon_foreground.png
    - assets/sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
